[package]
name = "hqc-kem"
version = "0.1.0"
edition = "2024"

[dependencies]
hybrid-array = { git = "https://github.com/NicsTr/hybrid-array.git", version = "0.4.13", features = ["extra-sizes", "zerocopy"] }
# hybrid-array = { path = "../hybrid-array", version = "0.4.13", features = ["extra-sizes", "zerocopy"] }
sha3 = { version = "0.12.0", default-features = false }
